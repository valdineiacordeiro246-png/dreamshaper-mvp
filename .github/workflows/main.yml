name: Testes e Cobertura
on:
  push:
    branches: [ principal ]
  pull_request:
    branches: [ principal ]

jobs:
  cobertura:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Executar testes
        run: npm test        
                   
